name: Build Standalone Engines

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Engine + CUDA Pack
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install pyinstaller
          pip install nvidia-cublas-cu12 nvidia-cudnn-cu12

      - name: Compile Windows Standalone Engine (CPU Core)
        run: |
          python tools/build_standalone.py

      - name: Package CUDA Runtime Zip
        run: |
          python tools/build_standalone.py --package-cuda-zip

      - name: Compress Windows Engine
        shell: pwsh
        run: |
          Compress-Archive -Path "tools/win/engine" -DestinationPath "quicksub-engine-win-x64.zip" -Force

      - name: Upload Windows Engine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicksub-engine-win-x64
          path: quicksub-engine-win-x64.zip

      - name: Upload CUDA Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuda-runtime-win-x64
          path: tools/cuda-runtime-win-x64.zip

  build-mac-arm64:
    name: macOS Apple Silicon (M1/M2/M3) Engine
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install pyinstaller

      - name: Compile macOS ARM64 Standalone Engine
        run: |
          python tools/build_standalone.py

      - name: Set Permissions & Ad-hoc Sign
        run: |
          chmod -R +x tools/mac/engine
          codesign --force --deep --sign - tools/mac/engine/generate_captions

      - name: Compress macOS ARM64 Engine
        run: |
          cd tools/mac
          zip -r ../../quicksub-engine-mac-arm64.zip engine

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicksub-engine-mac-arm64
          path: quicksub-engine-mac-arm64.zip

  build-mac-x64:
    name: macOS Intel Engine
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install pyinstaller

      - name: Compile macOS Intel Standalone Engine
        run: |
          python tools/build_standalone.py

      - name: Set Permissions & Ad-hoc Sign
        run: |
          chmod -R +x tools/mac/engine
          codesign --force --deep --sign - tools/mac/engine/generate_captions

      - name: Compress macOS Intel Engine
        run: |
          cd tools/mac
          zip -r ../../quicksub-engine-mac-x64.zip engine

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicksub-engine-mac-x64
          path: quicksub-engine-mac-x64.zip

  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-windows, build-mac-arm64, build-mac-x64]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: quicksub-engine-win-x64

      - name: Download CUDA Artifact
        uses: actions/download-artifact@v4
        with:
          name: cuda-runtime-win-x64

      - name: Download Mac ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: quicksub-engine-mac-arm64

      - name: Download Mac Intel Artifact
        uses: actions/download-artifact@v4
        with:
          name: quicksub-engine-mac-x64

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quicksub-engine-win-x64.zip
            quicksub-engine-mac-arm64.zip
            quicksub-engine-mac-x64.zip
            cuda-runtime-win-x64.zip
          generate_release_notes: true
